<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Animated illustration of a QA engineer at a laptop while tests pass and a bug gets fixed">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2027"/><stop offset="0.55" stop-color="#203a43"/><stop offset="1" stop-color="#2c5364"/></linearGradient>
<linearGradient id="lap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe7ec"/><stop offset="1" stop-color="#b9c7cf"/></linearGradient>
<linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14c9b2"/><stop offset="1" stop-color="#00968a"/></linearGradient>
</defs>
<style>
.lbl{font:12px 'Courier New',monospace;fill:#d6dde3}
.pass{font:700 11px 'Courier New',monospace;fill:#3ddc84;opacity:0}
.hdr{font:11px 'Courier New',monospace;fill:#7fa8b3}
.tag{font:600 14px 'Courier New',monospace;fill:#00E5C7;letter-spacing:1px}
.big{font:700 12px 'Courier New',monospace}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.f1{animation:fl 4s ease-in-out infinite alternate}
.f2{animation:fl 4.6s ease-in-out infinite alternate-reverse}
@keyframes fl{from{transform:translateY(-4px)}to{transform:translateY(5px)}}
.handL{animation:tp .3s ease-in-out infinite alternate}
.handR{animation:tp .3s ease-in-out .15s infinite alternate}
@keyframes tp{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.breath{animation:br 3.5s ease-in-out infinite}
@keyframes br{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:bl 4.5s infinite}
@keyframes bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.steam{animation:st 2.4s ease-in-out infinite;opacity:0}
.steam2{animation:st 2.4s ease-in-out 1.2s infinite;opacity:0}
@keyframes st{0%{opacity:0;transform:translateY(4px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}
.code{animation:cd 5s ease-in-out infinite alternate;font:700 20px 'Courier New',monospace;fill:#00E5C7;opacity:.55}
@keyframes cd{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.legs{animation:wig .22s steps(2) infinite alternate}
@keyframes wig{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.ok0{opacity:0;animation:ok0 10.0s infinite}.sp0{animation:sp0 10.0s infinite}
.ok1{opacity:0;animation:ok1 10.0s infinite}.sp1{animation:sp1 10.0s infinite}
.ok2{opacity:0;animation:ok2 10.0s infinite}.sp2{animation:sp2 10.0s infinite}
.fixed{opacity:0;animation:fixed 10.0s infinite}
.open{animation:open 10.0s infinite}
.allok{opacity:0;animation:allok 10.0s infinite}
@keyframes ok0{0%,14.99%{opacity:0}15.00%,94.00%{opacity:1}94.01%,100%{opacity:0}}
@keyframes sp0{0%,14.99%{opacity:1}15.00%,93.99%{opacity:0}94.00%,100%{opacity:1}}
@keyframes ok1{0%,29.99%{opacity:0}30.00%,94.00%{opacity:1}94.01%,100%{opacity:0}}
@keyframes sp1{0%,29.99%{opacity:1}30.00%,93.99%{opacity:0}94.00%,100%{opacity:1}}
@keyframes ok2{0%,44.99%{opacity:0}45.00%,94.00%{opacity:1}94.01%,100%{opacity:0}}
@keyframes sp2{0%,44.99%{opacity:1}45.00%,93.99%{opacity:0}94.00%,100%{opacity:1}}
@keyframes fixed{0%,54.99%{opacity:0}55.00%,94.00%{opacity:1}94.01%,100%{opacity:0}}
@keyframes open{0%,54.99%{opacity:1}55.00%,93.99%{opacity:0}94.00%,100%{opacity:1}}
@keyframes allok{0%,61.99%{opacity:0}62.00%,94.00%{opacity:1}94.01%,100%{opacity:0}}
</style>
<rect width="900" height="380" rx="18" fill="url(#bg)"/>
<circle cx="110" cy="320" r="120" fill="#ffffff" opacity=".03"/><circle cx="800" cy="60" r="140" fill="#00E5C7" opacity=".04"/>
<text x="450" y="38" text-anchor="middle" class="tag">TEST · BREAK · VERIFY · REPEAT</text>

<!-- floating code symbols -->
<text x="350" y="92" class="code">&lt;/&gt;</text>
<text x="520" y="110" class="code" style="animation-delay:-2s">{ }</text>

<!-- left card: test suite -->
<g class="f1">
<rect x="70" y="62" width="240" height="160" rx="14" fill="#0b141a" stroke="#00E5C7" stroke-opacity=".7" stroke-width="1.5"/>
<circle cx="90" cy="82" r="4" fill="#ff5f56"/><circle cx="105" cy="82" r="4" fill="#ffbd2e"/><circle cx="120" cy="82" r="4" fill="#27c93f"/>
<text x="140" y="86" class="hdr">tests.spec.ts</text>
<line x1="70" y1="98" x2="310" y2="98" stroke="#203a43"/>
<text x="122" y="124" class="lbl">Login flow</text>
<g transform="translate(98,120)"><g class="sp0"><g class="spin"><circle r="7" fill="none" stroke="#7fa8b3" stroke-width="2" stroke-dasharray="10 8"/></g></g><g class="ok0"><circle r="8" fill="#2ea44f"/><path d="M-4 0 L-1 3.5 L4.5 -3" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<text x="290" y="124" text-anchor="end" class="pass ok0">PASS</text>
<text x="122" y="152" class="lbl">Checkout API</text>
<g transform="translate(98,148)"><g class="sp1"><g class="spin"><circle r="7" fill="none" stroke="#7fa8b3" stroke-width="2" stroke-dasharray="10 8"/></g></g><g class="ok1"><circle r="8" fill="#2ea44f"/><path d="M-4 0 L-1 3.5 L4.5 -3" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<text x="290" y="152" text-anchor="end" class="pass ok1">PASS</text>
<text x="122" y="180" class="lbl">DB validation</text>
<g transform="translate(98,176)"><g class="sp2"><g class="spin"><circle r="7" fill="none" stroke="#7fa8b3" stroke-width="2" stroke-dasharray="10 8"/></g></g><g class="ok2"><circle r="8" fill="#2ea44f"/><path d="M-4 0 L-1 3.5 L4.5 -3" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<text x="290" y="180" text-anchor="end" class="pass ok2">PASS</text>
<text x="190" y="208" text-anchor="middle" class="big allok" style="fill:#00E5C7">All tests passed</text>
</g>

<!-- right card: bug -->
<g class="f2">
<rect x="590" y="62" width="240" height="160" rx="14" fill="#0b141a" stroke="#00E5C7" stroke-opacity=".7" stroke-width="1.5"/>
<text x="610" y="86" class="hdr">Bug #142</text>
<line x1="590" y1="98" x2="830" y2="98" stroke="#203a43"/>
<text x="610" y="124" class="lbl">Checkout total mismatch</text>
<g class="open" transform="translate(640,170)">
 <g class="legs"><path d="M-12 4 L-20 12 M-14 -2 L-23 -4 M12 4 L20 12 M14 -2 L23 -4 M0 10 L0 18" stroke="#ff5f56" stroke-width="2.2" stroke-linecap="round"/></g>
 <ellipse cx="0" cy="0" rx="13" ry="14" fill="#ff5f56"/><circle cx="0" cy="-16" r="6" fill="#ff5f56"/>
 <path d="M-3 -21 L-7 -28 M3 -21 L7 -28" stroke="#ff5f56" stroke-width="2" stroke-linecap="round"/>
 <line x1="0" y1="-12" x2="0" y2="12" stroke="#0b141a" stroke-width="2"/>
</g>
<g class="fixed" transform="translate(640,170)"><circle r="20" fill="#2ea44f"/><path d="M-9 0 L-3 7 L10 -7" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="open"><rect x="690" y="156" width="110" height="28" rx="14" fill="#ff5f56" fill-opacity=".18" stroke="#ff5f56"/><text x="745" y="174" text-anchor="middle" class="big" style="fill:#ff7b72">OPEN</text></g>
<g class="fixed"><rect x="690" y="156" width="110" height="28" rx="14" fill="#2ea44f" fill-opacity=".2" stroke="#3ddc84"/><text x="745" y="174" text-anchor="middle" class="big" style="fill:#3ddc84">FIXED ✓</text></g>
</g>

<!-- desk -->
<rect y="330" width="900" height="50" fill="#0b1a20"/>
<rect x="40" y="322" width="820" height="10" rx="4" fill="#2c5364"/>

<!-- plant -->
<path d="M262 322 L270 296 L302 296 L310 322 Z" fill="#c2694a"/>
<rect x="266" y="290" width="40" height="8"
